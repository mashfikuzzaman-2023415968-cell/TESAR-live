# Runs the full phase gate (spec G.5) on every push and pull request.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked runtime dependencies (hash-checked)
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Install dev tools
        run: python -m pip install -r requirements-dev.txt
      - name: Generate test images
        run: python scripts/make_test_images.py
      - name: Phase gate
        run: python scripts/phase_gate.py --phase "$(cat .phase)"
      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gates-py${{ matrix.python-version }}
          path: runs/gates/
