coordinator: "127.0.0.1:50010"
lab_mode: false
workers:
  - {name: "phone-1", slots: 1, args: ["--device-class", "phone"]}
  - {name: "phone-2", slots: 1, args: ["--device-class", "phone"]}
  - {name: "phone-3", slots: 1, args: ["--device-class", "phone"]}
  - {name: "phone-4", slots: 1, args: ["--device-class", "phone"]}
